# The iPhone app. Generate the Xcode project with:  cd ios && xcodegen
# The game itself is ../index.html and ../lib, shared with the browser and Mac versions.
name: BananaKing3D
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: U88T3SPD73
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  BananaKing3D:
    type: application
    platform: iOS
    sources:
      - path: BananaKing
      - path: ../index.html
        buildPhase: resources
      - path: ../lib
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BananaKing3D
        PRODUCT_BUNDLE_IDENTIFIER: com.garyphelps.bananaking3d
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Banana King 3D
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: every orientation, so the game works in any window size and with multitasking
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
